<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
    <defs>
        <!-- Gold Gradient (Right Wing) -->
        <linearGradient id="goldWing" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="35%" stop-color="#fef08a" />
            <stop offset="100%" stop-color="#eab308" />
        </linearGradient>

        <!-- Center Fuselage Gradient -->
        <linearGradient id="violetBody" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e9d5ff" />
            <stop offset="100%" stop-color="#8b5cf6" />
        </linearGradient>

        <!-- Vivid Indigo-Purple Gradient (Left Wing - High Contrast) -->
        <linearGradient id="leftWing" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d8b4fe" />
            <stop offset="40%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#4f46e5" />
        </linearGradient>
    </defs>

    <!-- Background Squircle -->
    <rect width="32" height="32" rx="8.5" fill="#090114" />

    <!-- Left Origami Wing -->
    <path d="M 16 4 L 5 22 L 13 19 Z" fill="url(#leftWing)" />

    <!-- Right Origami Wing -->
    <path d="M 16 4 L 27 22 L 19 19 Z" fill="url(#goldWing)" />

    <!-- Center Fuselage Body -->
    <path d="M 16 4 L 19 19 L 16 27 L 13 19 Z" fill="url(#violetBody)" />

    <!-- Origami Crease Lines -->
    <line x1="16" y1="4" x2="16" y2="27" stroke="#ffffff" stroke-width="0.8" opacity="0.8" />
    <line x1="16" y1="4" x2="10.5" y2="20.5" stroke="#e0e7ff" stroke-width="0.6" opacity="0.7" />
    <line x1="16" y1="4" x2="21.5" y2="20.5" stroke="#d97706" stroke-width="0.6" opacity="0.7" />

    <!-- Center Energy Point -->
    <circle cx="16" cy="27" r="1.2" fill="#fbbf24" />
</svg>
